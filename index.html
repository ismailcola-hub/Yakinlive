      // Firebase Proje Yapılandırmanız (Kendi bilgilerinizi buraya yazabilirsiniz)

      window.fbDb = getFirestore(app);
      window.googleProvider = new GoogleAuthProvider();
      window.facebookProvider = new FacebookAuthProvider();
