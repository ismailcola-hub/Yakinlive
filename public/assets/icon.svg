<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1647"/>
      <stop offset="50%" stop-color="#140f24"/>
      <stop offset="100%" stop-color="#0a0713"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4f91"/>
      <stop offset="100%" stop-color="#9a68ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Glowing Broadcast Signal Arcs -->
  <g transform="translate(256, 270)" filter="url(#glow)">
    <!-- Outer Arc Left -->
    <path d="M -110,-90 A 140,140 0 0,0 -110,90" fill="none" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" opacity="0.65"/>
    <!-- Outer Arc Right -->
    <path d="M 110,-90 A 140,140 0 0,1 110,90" fill="none" stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" opacity="0.65"/>
    
    <!-- Inner Arc Left -->
    <path d="M -65,-55 A 85,85 0 0,0 -65,55" fill="none" stroke="url(#neonGrad)" stroke-width="18" stroke-linecap="round"/>
    <!-- Inner Arc Right -->
    <path d="M 65,-55 A 85,85 0 0,1 65,55" fill="none" stroke="url(#neonGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Center Pulse Orb -->
    <circle cx="0" cy="0" r="32" fill="url(#neonGrad)"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
  </g>

  <!-- Top Sparkle -->
  <g transform="translate(380, 100)">
    <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#ffd700"/>
  </g>
</svg>
